[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:dotnet]
command=dotnet /app/backend/AumoBackend.dll --urls="http://127.0.0.1:5000"
directory=/app/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
priority=1
startsecs=5
environment=ASPNETCORE_ENVIRONMENT="Production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:archiver]
command=/usr/local/bin/archiver-service
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
priority=2
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=3
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
