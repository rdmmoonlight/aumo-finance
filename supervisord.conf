[supervisord]
user=root
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:dotnet]
command=dotnet /app/backend/AumoBackend.dll
directory=/app/backend
autostart=true
autorestart=true
priority=1
startsecs=5
environment=ASPNETCORE_URLS="http://127.0.0.1:5000",ASPNETCORE_ENVIRONMENT="Production"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=2
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
