<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aumo Finance | Operations, neatly organized.</title>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <link rel="stylesheet" href="/src/app/landing.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="redirecting" class="redirecting">
      <div class="redirecting-box"><div class="spinner"></div><span>Redirecting...</span></div>
    </div>

    <div class="landing">
      <aside class="panel-left">
        <div class="brand"><div class="brand-logo">A</div><span>AUMO FINANCE</span></div>
        <div class="hero">
          <h1>Operations,<br/> neatly<br/> organized.</h1>
          <p>Matte, tenang, tanpa distraksi.</p>
        </div>
      </aside>
      <main class="panel-right">
        <div class="welcome"><h2>Selamat Datang</h2><p>Silakan masuk atau buat akun baru.</p></div>
        <div class="actions">
          <button id="btn-login" class="btn btn-primary"><span id="login-text">Sign In</span></button>
          <button id="btn-register" class="btn btn-secondary">Register</button>
        </div>
      </main>
    </div>

    <div id="modal-overlay" class="overlay">
      <div class="modal">
        <div class="modal-head"><h3 id="modal-title">Sign In</h3><button id="modal-close">✕</button></div>
        <div class="modal-body">
          <div id="google-btn-container"></div>
          <div class="divider"><span>or</span></div>
          <div id="auth-form-container"></div>
        </div>
      </div>
    </div>

    <!-- INI YANG KEMARIN SALAH PATH -->
    <script type="module" src="/src/app/landing.ts"></script>
  </body>
</html>
