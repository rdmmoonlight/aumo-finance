<!-- Template statis untuk form auth (vanilla). Di-import lewat `./auth.html?raw` oleh auth.js. -->

<template id="auth-skeleton">
  <div
    class="flex h-80 w-full max-w-sm animate-pulse items-center justify-center rounded-2xl border bg-white p-6"
  >
    <p class="text-sm text-zinc-400">Loading workspace...</p>
  </div>
</template>

<template id="auth-form">
  <div
    class="light w-full max-w-sm rounded-2xl border border-zinc-200 bg-white p-6 text-black shadow-sm"
  >
    <div class="mb-6">
      <h2 data-ref="title" class="text-2xl font-semibold tracking-tight"></h2>
      <p data-ref="subtitle" class="mt-1 text-sm text-zinc-600"></p>
    </div>

    <div class="space-y-4">
      <button
        type="button"
        data-ref="google"
        class="inline-flex h-11 w-full shrink-0 items-center justify-center gap-2 rounded-xl border border-zinc-300 bg-white px-4 py-2 text-sm font-medium whitespace-nowrap text-zinc-700 shadow-xs transition-all outline-none hover:bg-zinc-50 hover:text-accent-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50 dark:border-input dark:bg-input/30 dark:hover:bg-input/50"
      >
        <svg
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
          focusable="false"
          class="mr-2 h-4 w-4"
        >
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />
          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
          />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
          />
        </svg>
        Continue with Google
      </button>
      <div class="relative flex items-center justify-center">
        <div class="w-full border-t border-zinc-200"></div>
        <span
          class="absolute bg-white px-2 font-mono text-[10px] text-zinc-400 uppercase"
        >
          OR
        </span>
      </div>
    </div>

    <form data-ref="form" novalidate class="mt-4 space-y-4">
      <div class="space-y-1.5">
        <label
          data-for="email"
          class="flex items-center gap-2 text-xs leading-none font-semibold uppercase select-none"
          >Email</label
        >
        <input
          data-ref="email"
          name="email"
          autocomplete="email"
          placeholder="nama@email.com"
          class="h-11 w-full min-w-0 rounded-xl border border-input bg-zinc-50 px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none selection:bg-primary selection:text-primary-foreground placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 md:text-sm dark:bg-input/30"
        />
        <p data-ref="emailError" hidden class="text-xs text-red-600"></p>
      </div>

      <div class="space-y-1.5">
        <div class="flex justify-between">
          <label
            data-for="password"
            class="flex items-center gap-2 text-xs leading-none font-semibold uppercase select-none"
            >Password</label
          >
          <button
            type="button"
            data-ref="togglePassword"
            class="text-xs text-zinc-600"
          >
            Show
          </button>
        </div>
        <input
          data-ref="password"
          name="password"
          type="password"
          placeholder="••••••••"
          class="h-11 w-full min-w-0 rounded-xl border border-input bg-zinc-50 px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none selection:bg-primary selection:text-primary-foreground placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 md:text-sm dark:bg-input/30"
        />
        <p data-ref="passwordError" hidden class="text-xs text-red-600"></p>
      </div>

      <div data-mode="register" class="space-y-1.5">
        <div class="flex justify-between">
          <label
            data-for="confirmPassword"
            class="flex items-center gap-2 text-xs leading-none font-semibold uppercase select-none"
            >Confirm Password</label
          >
          <button
            type="button"
            data-ref="toggleConfirmPassword"
            class="text-xs text-zinc-600"
          >
            Show
          </button>
        </div>
        <input
          data-ref="confirmPassword"
          name="confirmPassword"
          type="password"
          placeholder="••••••••"
          class="h-11 w-full min-w-0 rounded-xl border border-input bg-zinc-50 px-3 py-1 text-base shadow-xs transition-[color,box-shadow] outline-none selection:bg-primary selection:text-primary-foreground placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:cursor-not-allowed disabled:opacity-50 md:text-sm dark:bg-input/30"
        />
        <p
          data-ref="confirmPasswordError"
          hidden
          class="text-xs text-red-600"
        ></p>
      </div>

      <div data-mode="login" class="flex items-center justify-between pt-1">
        <div class="flex items-center space-x-2">
          <button
            type="button"
            role="checkbox"
            aria-checked="false"
            data-ref="keepMe"
            data-state="unchecked"
            class="peer size-4 shrink-0 rounded-[4px] border border-input shadow-xs transition-shadow outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-50 data-[state=checked]:border-primary data-[state=checked]:bg-primary data-[state=checked]:text-primary-foreground dark:bg-input/30 dark:data-[state=checked]:bg-primary"
          >
            <span
              data-ref="keepMeIndicator"
              hidden
              class="grid place-content-center text-current transition-none"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                class="size-3.5"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
            </span>
          </button>
          <label
            data-ref="keepMeLabel"
            class="flex items-center gap-2 text-xs leading-none font-medium select-none"
            >Keep me signed in</label
          >
        </div>
        <a href="#" class="text-xs underline">Forgot?</a>
      </div>

      <div
        data-ref="apiError"
        role="alert"
        hidden
        class="rounded-xl border border-red-200 bg-red-50 px-3.5 py-3 text-xs text-red-600"
      ></div>

      <button
        type="submit"
        data-ref="submit"
        class="inline-flex h-11 w-full shrink-0 items-center justify-center gap-2 rounded-xl bg-black px-4 py-2 text-sm font-medium whitespace-nowrap text-white transition-all outline-none hover:bg-zinc-800 focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:pointer-events-none disabled:opacity-50"
      ></button>
    </form>

    <div class="mt-5 text-center text-xs text-zinc-600">
      <span data-mode="login">
        Belum punya akun?
        <button
          type="button"
          data-ref="toRegister"
          class="font-semibold underline"
        >
          Sign Up
        </button>
      </span>
      <span data-mode="register">
        Sudah punya akun?
        <button
          type="button"
          data-ref="toLogin"
          class="font-semibold underline"
        >
          Sign In
        </button>
      </span>
    </div>
  </div>
</template>
