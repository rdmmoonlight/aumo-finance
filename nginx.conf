events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Filter origin yang diizinkan untuk akses lintas domain (Tauri v2 Windows/macOS/Linux & dev)
    map $http_origin $cors_origin {
        default "";
        "~^http://tauri\.localhost$" $http_origin;
        "~^https://tauri\.localhost$" $http_origin;
        "~^tauri://localhost$" $http_origin;
        "~^http://localhost(:[0-9]+)?$" $http_origin;
    }

    server {
        listen 10000;
        server_name _;

        # Mencegah Nginx menambahkan port internal (10000) pada redirect
        absolute_redirect off;
        port_in_redirect off;

        # 1. Static Assets Frontend (Vue.js SPA)
        location / {
            root /app/frontend-dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 2. Endpoint Health Check ke .NET Core Backend
        location /health {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'keep-alive';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # 3. Dokumentasi Scalar & OpenAPI (.NET Core)
        location ~ ^/(reference|openapi|scalar) {
            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }

        # 4. API Endpoints ke .NET Core Backend (+ Support CORS Tauri Desktop)
        location /api {
            # Tangani Preflight Request (OPTIONS) dari aplikasi Desktop Tauri
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                return 204;
            }

            # Header CORS untuk response asli (GET, POST, dll) ke Desktop Tauri
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;

            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'keep-alive';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
