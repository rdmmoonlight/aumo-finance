events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Upstream Services (Port aplikasi di localhost)
    upstream frontend_svc {
        server 127.0.0.1:3000;
    }

    upstream dotnet_svc {
        server 127.0.0.1:5000;
    }

    upstream axum_svc {
        server 127.0.0.1:5001;
    }

    upstream go_svc {
        server 127.0.0.1:5002;
    }

    server {
        listen 8080; # Gunakan port 8080 agar tidak perlu akses root/administrator
        server_name localhost;

        # Next.js Frontend
        location / {
            proxy_pass http://frontend_svc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ASP.NET Core API
        location /api/dotnet/ {
            proxy_pass http://dotnet_svc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Rust Axum API
        location /api/axum/ {
            proxy_pass http://axum_svc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Go API
        location /api/go/ {
            proxy_pass http://go_svc/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}