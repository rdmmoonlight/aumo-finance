<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8" />
  <title>Aumo Finance</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles.css" />
</head>

<body class="bg-slate-50 antialiased">
  <app-root>
    <!-- Loading UI saat pingGuard menembak GET / -->
    <div
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; padding: 1rem; text-align: center;">
      <div
        style="width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: #0f172a; border-radius: 50%; animation: spin 0.8s linear infinite;">
      </div>
      <p style="margin-top: 18px; margin-bottom: 4px; font-size: 15px; font-weight: 600; color: #0f172a;">Membangunkan
        Server & Database...</p>
      <p style="margin: 0; font-size: 13px; color: #64748b;">Mohon tunggu sebentar, layanan sedang disiapkan.</p>
    </div>
    <style>
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </app-root>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
