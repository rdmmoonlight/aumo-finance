services:
  # ======================
  # Rust Core (Internal Only)
  # ======================
  axum:
    build:
      context: ./axum
      dockerfile: Dockerfile
    container_name: aumo-axum
    # Tidak ada "ports:" → tidak bisa diakses dari luar
    expose:
      - "8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ======================
  # ASP.NET Core (Satu-satunya yang terekspos)
  # ======================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aumo-api
    ports:
      - "8080:8080"          # Hanya port ini yang terbuka ke luar
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - RustCore__BaseUrl=http://axum:8081
    depends_on:
      axum:
        condition: service_healthy
    restart: unless-stopped
