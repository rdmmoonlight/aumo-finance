name: Architecture Guardrail

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ===== BACKEND CHECKS =====
      - name: Verify Controllers Cleanliness
        working-directory: backend
        run: |
          echo "=== Checking backend/Controllers for embedded DTOs ==="
          STRAY_DTOS=$(grep -rnE '^\s*public\s+(class|record)\s+' Controllers/ | grep -v 'Controller :' || true)

          if [ -n "$STRAY_DTOS" ]; then
            echo "::error::DTO/Kelas non-Controller terdeteksi di backend/Controllers! Harap CUT kelas tersebut dan pindahkan ke file Core/swab.cs."
            echo "--- Daftar Kelas Yang Tertinggal ---"
            echo "$STRAY_DTOS"
            exit 1
          else
            echo "[OK] Controllers 100% steril dari DTO!"
          fi

      - name: Verify Core Cleanliness
        working-directory: backend
        run: |
          echo "=== Checking backend/Core for Controller classes ==="
          STRAY_CONTROLLERS=$(grep -rnE '^\s*public\s+(class|record)\s+[A-Za-z0-9]+Controller\b' Core/ || true)

          if [ -n "$STRAY_CONTROLLERS" ]; then
            echo "::error::Kelas Controller terdeteksi di folder backend/Core! Harap CUT dan pindahkan ke folder Controllers/."
            echo "--- Daftar Controller Salah Tempat ---"
            echo "$STRAY_CONTROLLERS"
            exit 1
          else
            echo "[OK] Core 100% steril dari Controller!"
          fi

      # ===== FRONTEND CHECKS - BARU =====
      - name: Verify Frontend Style Cleanliness
        run: |
          echo "=== Checking frontend for stray CSS outside /style ==="
          
          # 1. Cek file .css/.scss yang nyasar di luar frontend/style
          echo "--> Cek file .css/.scss liar..."
          STRAY_CSS_FILES=$(find frontend -type f \( -name "*.css" -o -name "*.scss" \) \
            ! -path "*/frontend/style/*" \
            ! -path "*/node_modules/*" \
            ! -path "*/.next/*" \
            ! -path "*/dist/*" \
            ! -path "*/build/*" || true)

          if [ -n "$STRAY_CSS_FILES" ]; then
            echo "::error::File CSS terdeteksi di luar folder frontend/style! Semua CSS WAJIB di frontend/style/"
            echo "--- Daftar File Salah Tempat ---"
            echo "$STRAY_CSS_FILES"
            exit 1
          fi

          # 2. Cek kode CSS mentah (.class { }, @apply, @keyframes, @import *.css) di file tsx/jsx
          echo "--> Cek kode CSS mentah di komponen..."
          STRAY_CSS_CODE=$(grep -rnE '^\s*\.[a-zA-Z0-9_\-]+\s*\{|@apply\s+|@keyframes\s+|^\s*@import.*\.css|^\s*@tailwind' frontend \
            --include="*.tsx" --include="*.ts" --include="*.jsx" --include="*.js" \
            | grep -v "frontend/style" \
            | grep -v "node_modules" \
            | grep -v ".next" || true)

          if [ -n "$STRAY_CSS_CODE" ]; then
            echo "::error::Kode CSS mentah terdeteksi di luar frontend/style! Pindahkan ke index.css / theme.css"
            echo "--- Daftar Kode Yang Tertinggal ---"
            echo "$STRAY_CSS_CODE"
            exit 1
          fi

          # 3. Cek <style> tag (inline style block) yang haram
          echo "--> Cek <style> tag liar..."
          STRAY_STYLE_TAG=$(grep -rn "<style" frontend \
            --include="*.tsx" --include="*.jsx" \
            | grep -v "node_modules" \
            | grep -v "frontend/style" || true)

          if [ -n "$STRAY_STYLE_TAG" ]; then
            echo "::error::<style> tag terdeteksi di luar frontend/style! Dilarang pakai <style> di komponen."
            echo "--- Daftar Tag Salah Tempat ---"
            echo "$STRAY_STYLE_TAG"
            exit 1
          fi

          echo "[OK] Frontend 100% steril - semua CSS hanya di /style!"
