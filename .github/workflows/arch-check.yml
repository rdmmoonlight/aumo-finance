name: Architecture Guardrail

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Controllers Cleanliness
        working-directory: backend
        run: |
          STRAY_DTOS=$(grep -rnE '^\s*public\s+(class|record)\s+' Controllers/ | grep -v 'Controller :' || true)
          if [ -n "$STRAY_DTOS" ]; then echo "::error::DTO di Controllers!"; echo "$STRAY_DTOS"; exit 1; fi
          echo "[OK] Controllers steril!"

      - name: Verify Core Cleanliness
        working-directory: backend
        run: |
          STRAY_CONTROLLERS=$(grep -rnE '^\s*public\s+(class|record)\s+[A-Za-z0-9]+Controller\b' Core/ || true)
          if [ -n "$STRAY_CONTROLLERS" ]; then echo "::error::Controller di Core!"; echo "$STRAY_CONTROLLERS"; exit 1; fi
          echo "[OK] Core steril!"
