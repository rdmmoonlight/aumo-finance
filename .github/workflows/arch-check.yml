name: Architecture Guardrail

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check-architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Controllers Cleanliness
        run: |
          echo "=== Checking backend/Controllers for embedded DTOs ==="
          STRAY_DTOS=$(grep -rnE '^\s*public\s+(class|record)\s+' Controllers/ | grep -v 'Controller :' || true)

          if [ -n "$STRAY_DTOS" ]; then
            echo "::error::DTO/Kelas non-Controller terdeteksi di backend/Controllers! Harap CUT kelas tersebut dan pindahkan ke file Core/swab.cs."
            echo "--- Daftar Kelas Yang Tertinggal ---"
            echo "$STRAY_DTOS"
            exit 1
          else
            echo "[OK] Controllers 100% steril dari DTO!"
          fi

      - name: Verify Core Cleanliness
        run: |
          echo "=== Checking backend/Core for Controller classes ==="
          STRAY_CONTROLLERS=$(grep -rnE '^\s*public\s+(class|record)\s+[A-Za-z0-9]+Controller\b' Core/ || true)

          if [ -n "$STRAY_CONTROLLERS" ]; then
            echo "::error::Kelas Controller terdeteksi di folder backend/Core! Harap CUT dan pindahkan ke folder Controllers/."
            echo "--- Daftar Controller Salah Tempat ---"
            echo "$STRAY_CONTROLLERS"
            exit 1
          else
            echo "[OK] Core 100% steril dari Controller!"
          fi
