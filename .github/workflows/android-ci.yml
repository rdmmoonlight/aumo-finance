name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  lint-and-fix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: mobile

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1. Jalankan Auto-fix Ktlint
      - name: Auto-fix Kotlin style
        run: ./gradlew ktlintFormat --continue
        continue-on-error: true

      # 2. Commit dan push otomatis jika ada file yang diubah oleh ktlintFormat
      - name: Commit auto-fix changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix Kotlin code style [skip ci]"
          working_directory: mobile

      # 3. Jalankan Android Lint
      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace
