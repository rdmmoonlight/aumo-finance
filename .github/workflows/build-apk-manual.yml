name: Build APK (Manual)

on:
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verifikasi Android SDK bawaan runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version || true

      - name: Install dependencies
        run: npm ci

      - name: Tentukan nomor versi (YY.MM.urutan build bulan ini)
        id: version
        run: node scripts/bump-build-number.js

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Build APK release (Gradle)
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Rename APK sesuai versi
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/Aumo_${{ steps.version.outputs.tag }}.apk"

      - name: Upload APK sebagai artifact run
        uses: actions/upload-artifact@v4
        with:
          name: Aumo_${{ steps.version.outputs.tag }}
          path: mobile/dist/Aumo_${{ steps.version.outputs.tag }}.apk

      - name: Buat GitHub Release + upload APK (sumber deteksi fitur auto-update)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/Aumo_${{ steps.version.outputs.tag }}.apk" \
            --repo "${{ github.repository }}" \
            --title "Aumo ${{ steps.version.outputs.tag }}" \
            --notes "Build manual dari GitHub Actions (workflow_dispatch) - ${{ steps.version.outputs.tag }}."

      - name: Commit balik counter versi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump build counter to ${{ steps.version.outputs.tag }}"
            git push origin HEAD:main
          else
            echo "Tidak ada perubahan pada build-version.json"
          fi
