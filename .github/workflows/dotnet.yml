name: .NET Build

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/asp-net-core/**' # sesuaikan path folder .NET
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/dotnet/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Build .NET
        run: dotnet build
