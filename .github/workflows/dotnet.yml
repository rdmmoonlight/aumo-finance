name: .NET Build

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/asp-net-core/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/asp-net-core/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend/asp-net-core

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build .NET
        run: dotnet build --no-restore
