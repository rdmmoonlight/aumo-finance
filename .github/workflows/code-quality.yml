name: Quality & Formatting Workflow

on:
  branches: [ main ]
  paths:
      - 'frontend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint-format-frontend:
    runs-on: ubuntu-latest

    steps:
      # 1. CHECKOUT REPOSITORY
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # 2. SETUP ENVIRONMENT (PNPM & NODE.JS)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # 3. SETUP BIOME CLI
      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      # 4. INSTALL DEPENDENCIES & RUN BIOME
      - name: Install Frontend Dependencies
        run: pnpm install
        working-directory: frontend

      - name: Run Biome Check & Format (Frontend)
        run: biome check --write .
        working-directory: frontend

      # 5. COMMIT CHANGES
      - name: Commit Formatted Changes
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-correct formatting & linting with Biome [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: "frontend/*"
