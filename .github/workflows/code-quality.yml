name: Quality & Formatting Workflow

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint-format-frontend:
    runs-on: ubuntu-latest

    steps:
      # 1. CHECKOUT REPOSITORY
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # 2. SETUP PNPM
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      # 3. SETUP NODE.JS WITH PNPM CACHE
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 4. INSTALL DEPENDENCIES & RUN ESLINT
      - name: Install Frontend Dependencies
        run: pnpm install
        working-directory: frontend

      - name: Run ESLint
        run: pnpm exec eslint . --fix
        working-directory: frontend

      # 5. COMMIT CHANGES
      - name: Commit Formatted Changes
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-correct formatting & linting with ESLint [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: "frontend/**"

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore AumoBackend.Test/AumoBackend.Test.csproj

      # Tes integrasi memakai Testcontainers (PostgreSQL di Docker, tersedia di ubuntu-latest).
      - name: Run Backend Tests
        run: dotnet test AumoBackend.Test/AumoBackend.Test.csproj --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/AumoBackend.Test/TestResults/*.trx
