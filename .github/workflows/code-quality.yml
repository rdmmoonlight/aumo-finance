name: C# & TypeScript Quality, Formatting & Test Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-analyze-test:
    runs-on: ubuntu-latest

    steps:
      # 0. JEDA / SLEEP 60 DETIK
      - name: Sleep for 60 seconds
        run: sleep 60

      # 1. CHECKOUT REPOSITORY
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # 2. SETUP ENVIRONMENT (.NET & NODE.JS)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 3. BACKEND (.NET C#)
      - name: Restore .NET Dependencies
        run: dotnet restore
        working-directory: backend

      # Mencegah error build akibat warning di dotnet format
      - name: Auto-Format C# Code
        run: dotnet format || true
        working-directory: backend

      - name: Build & Typecheck (.NET)
        run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true
        working-directory: backend

      # 4. FRONTEND (Next.js & Playwright)
      - name: Install Frontend Dependencies
        run: npm install
        working-directory: frontend

      - name: Run Prettier Check/Write (Frontend)
        run: npx prettier --write .
        working-directory: frontend

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: frontend

      - name: Run Playwright Tests
        run: npx playwright test --pass-with-no-tests
        working-directory: frontend

      # 5. COMMIT AUTO-FORMATTED CHANGES & UPDATED PACKAGE-LOCK
      - name: Commit Formatted Changes & Lockfiles
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-correct formatting & sync package-lock.json [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: "backend/* frontend/*"

      # 6. UPLOAD PLAYWRIGHT REPORT
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
