name: C# & TypeScript Quality, Formatting & Test Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Memastikan hanya 1 workflow berjalan dalam satu waktu untuk branch/ref ini
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint-analyze-test:
    runs-on: ubuntu-latest

    steps:
      # 0. JEDA / SLEEP 60 DETIK
      - name: Sleep for 60 seconds
        run: sleep 60

      # 1. CHECKOUT REPOSITORY
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # 2. SETUP ENVIRONMENT (.NET, PNPM, & NODE.JS)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            nest/pnpm-lock.yaml
            analog/pnpm-lock.yaml

      # 3. BACKEND (.NET C#)
      - name: Restore .NET Dependencies
        run: dotnet restore
        working-directory: backend

      # Mencegah error build akibat warning di dotnet format
      - name: Auto-Format C# Code
        run: dotnet format || true
        working-directory: backend

      - name: Build & Typecheck (.NET)
        run: dotnet build --configuration Release /p:TreatWarningsAsErrors=true
        working-directory: backend

      # 4. FRONTEND (Next.js & Playwright)
      - name: Install Frontend Dependencies
        run: pnpm install
        working-directory: frontend

      # Typecheck tidak menulis tsbuildinfo agar tidak ikut ter-commit
      - name: Typecheck (Frontend)
        run: pnpm exec tsc --noEmit --incremental false
        working-directory: frontend

      - name: Run Prettier Check/Write (Frontend)
        run: pnpm exec prettier --write .
        working-directory: frontend

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
        working-directory: frontend

      - name: Run Playwright Tests
        run: pnpm exec playwright test --pass-with-no-tests
        working-directory: frontend

      # 5. NESTJS SERVICE (nest)
      - name: Install Nest Dependencies
        run: pnpm install
        working-directory: nest

      - name: Typecheck & Build (Nest)
        run: pnpm run build
        working-directory: nest

      - name: Run Prettier (Nest)
        run: pnpm exec prettier --write .
        working-directory: nest

      # 6. ANALOG FRAMEWORK SERVICE (analog)
      - name: Install Analog Dependencies
        run: pnpm install
        working-directory: analog

      - name: Typecheck & Build (Analog)
        run: pnpm run build
        working-directory: analog

      - name: Run Prettier (Analog)
        run: pnpm exec prettier --write .
        working-directory: analog

      # 7. COMMIT AUTO-FORMATTED CHANGES & UPDATED LOCKFILES
      - name: Commit Formatted Changes & Lockfiles
        id: auto_commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-correct formatting & sync pnpm-lock.yaml [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          file_pattern: "backend/* frontend/* nest/* analog/*"

      # 8. UPLOAD PLAYWRIGHT REPORT
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
