name: Build & Release Windows App (Electronjs)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag versi release (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_name:
        description: 'Judul Release (contoh: Release v1.0.0)'
        required: true
        default: 'Release v1.0.0'
        type: string
      draft:
        description: 'Simpan sebagai Draft (belum dipublikasikan)?'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: pnpm install

      - name: Install dependencies (Electron)
        working-directory: ./electron
        run: pnpm install

      - name: Build Frontend & Package Windows (.exe)
        working-directory: ./electron
        run: pnpm dist:win
        env:
          # Nonaktifkan code signing otomatis karena tidak pakai sertifikat berbayar
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: |
            electron/release/*.exe
            electron/release/*.blockmap
            electron/release/latest.yml
