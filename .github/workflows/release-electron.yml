name: Build & Release Windows App (Electronjs)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag manual (opsional, kosongkan untuk otomatis vYY.M.N.EL)"
        required: false
        type: string
      release_name:
        description: "Judul Release manual (opsional)"
        required: false
        type: string
      draft:
        description: "Simpan sebagai Draft (belum dipublikasikan)?"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CalVer version (.EL)
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          YEAR_MONTH=$(date +'%y.%-m')
          
          # Ambil tag terakhir khusus yang berakhiran .EL
          LATEST_TAG=$(gh release list --repo "${{ github.repository }}" --limit 30 --json tagName -q '[.[] | select(.tagName | endswith(".EL"))][0].tagName' 2>/dev/null || echo "")

          # Hapus awalan 'v' dan akhiran '.EL' untuk parsing angka
          CLEAN_VERSION="${LATEST_TAG#v}"
          CLEAN_VERSION="${CLEAN_VERSION%.EL}"

          if [ -n "$CLEAN_VERSION" ]; then
            LATEST_YEAR_MONTH=$(echo "$CLEAN_VERSION" | cut -d. -f1-2)
            LATEST_BUILD=$(echo "$CLEAN_VERSION" | cut -d. -f3)
          else
            LATEST_YEAR_MONTH=""
            LATEST_BUILD="0"
          fi

          if [ "$YEAR_MONTH" = "$LATEST_YEAR_MONTH" ]; then
            NEW_BUILD=$((LATEST_BUILD + 1))
          else
            NEW_BUILD=1
          fi

          # Versi numerik murni (untuk package.json / electron-builder)
          APP_VERSION="${YEAR_MONTH}.${NEW_BUILD}"
          # Tag lengkap dengan prefix 'v' dan suffix '.EL'
          RELEASE_TAG="v${APP_VERSION}.EL"

          echo "Rilis EL terakhir: ${LATEST_TAG:-<tidak ada>} -> tag baru: ${RELEASE_TAG}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          # VersionCode selalu naik (menit sejak epoch 2026-01-01 UTC)
          EPOCH_MINUTES=$(( ( $(date -u +%s) - $(date -u -d '2026-01-01T00:00:00Z' +%s) ) / 60 ))
          echo "version_code=$EPOCH_MINUTES" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install

      - name: Update package.json version
        working-directory: ./frontend
        shell: bash
        run: |
          npm version "${{ steps.version.outputs.app_version }}" --no-git-tag-version --allow-same-version

      - name: Create .env file
        working-directory: ./frontend
        shell: pwsh
        run: |
          @"
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APP_VERSION=${{ steps.version.outputs.release_tag }}
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Build Frontend & Package Windows (.exe)
        working-directory: ./frontend
        run: pnpm dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || steps.version.outputs.release_tag }}
          name: ${{ inputs.release_name || format('Release {0}', steps.version.outputs.release_tag) }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: |
            frontend/release/*.exe
            frontend/release/*.blockmap
            frontend/release/latest.yml
