name: Pull DB Schema (EF Core Scaffold)

on:
  workflow_dispatch: # Khusus trigger manual dari tab Actions

jobs:
  scaffold-db:
    name: Scaffold PostgreSQL Database
    runs-on: ubuntu-latest

    # Mengatur working directory default ke folder /backend
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Menggunakan SDK .NET 10

      - name: Install EF Core CLI Tool
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.* || dotnet tool update --global dotnet-ef --version 10.0.*
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Restore Dependencies
        run: dotnet restore AumoBackend.csproj

      - name: Clean Models Directory
        run: |
          echo "Clearing old Models directory..."
          rm -rf Models/*

      - name: Scaffold DbContext & Models from PostgreSQL
        env:
          CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          dotnet ef dbcontext scaffold "$CONNECTION_STRING" Npgsql.EntityFrameworkCore.PostgreSQL \
            --project AumoBackend.csproj \
            --output-dir Models \
            --context-dir Data \
            --context AppDbContext \
            --force \
            --no-build

      - name: Create Pull Request / Commit Changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(db): re-scaffold database models & context"
          title: "chore(db): update models & AppDbContext from database"
          body: "Workflow otomatis membesihkan folder Models dan me-scaffold ulang schema PostgreSQL terbaru."
          branch: "auto-db-scaffold"
          base: "main" # Sesuaikan dengan nama branch utama kamu (e.g. main/master)
