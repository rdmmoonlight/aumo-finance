name: Build Tauri (Windows Installer)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./vuejs-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './vuejs-tauri/src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Ambil versi aplikasi untuk Release Tag
        id: get_version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "v$($pkg.version)-build.${{ github.run_number }}" }
          echo "tag_name=$tag" >> $env:GITHUB_OUTPUT

      - name: Build Tauri Installer (NSIS & MSI)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: pnpm tauri build

      - name: Upload Installer sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            vuejs-tauri/src-tauri/target/release/bundle/nsis/*.exe
            vuejs-tauri/src-tauri/target/release/bundle/msi/*.msi

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: "Desktop App ${{ steps.get_version.outputs.tag_name }}"
          files: |
            vuejs-tauri/src-tauri/target/release/bundle/nsis/*.exe
            vuejs-tauri/src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
