name: Build Tauri (Windows Installer)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Otomatis jalan dan membuat GitHub Release saat push tag (misal: v1.0.0)

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./vuejs-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri Installer (NSIS & MSI)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        # Hapus --no-bundle agar menghasilkan installer resmi
        run: pnpm tauri build

      - name: Upload Installer sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Buat GitHub Release (khusus saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
