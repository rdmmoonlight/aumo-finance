name: Auto Generate RTK Query API

on:
  push:
    paths:
      - 'frontend/openapi-config.cjs'
  workflow_dispatch:

jobs:
  generate-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Generate API
        run: npx @rtk-query/codegen-openapi openapi-config.cjs

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(frontend): auto-generate API client from OpenAPI spec"
          file_pattern: "frontend/src/lib/store/**/*.ts"
