name: Auto Generate RTK Query API

# Generate client RTK Query dari OpenAPI backend (Render) lalu commit hasilnya.
# Otomatis jalan saat ada perubahan di folder backend. Typecheck ada di workflow Code Quality.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/openapi-config.cjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rtk-query-generate
  cancel-in-progress: true

env:
  API_URL: https://aumonext-api.onrender.com

jobs:
  generate-api:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # Menunggu deployment backend di Render selesai (delay 5 menit)
      - name: Sleep for 5 minutes
        run: |
          echo "Menunggu 5 menit agar backend selesai di-deploy di Render..."
          sleep 300

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate API
        run: pnpm run generate:api

      - name: List Added or Updated Files
        run: |
          echo "=== Status Perubahan File RTK Query ==="
          git status --porcelain src/lib/store
          echo "---------------------------------------"
          echo "Detail file yang ditambah/diubah:"
          git status --porcelain src/lib/store | awk '{print $2}'

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(frontend): auto-generate API client from OpenAPI spec"
          file_pattern: "frontend/src/lib/store/**/*.ts"
